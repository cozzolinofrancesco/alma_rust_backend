[package]
name = "alma-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
alma-domain = { path = "../domain" }
alma-application = { path = "../application" }
alma-infrastructure = { path = "../infrastructure" }
alma-macros = { path = "../macros" }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The RAG query handler's grounded-vs-lexical-fallback tests are `#[tokio::test]`
# async tests (they exercise the async `RetrievalPort`); the workspace tokio
# dep already enables the `macros`/`rt` features they need.
tokio = { workspace = true }
